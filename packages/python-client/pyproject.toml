[project]
name = "content-gateway-client"
version = "0.1.0"
description = "Typed client for content-gateway: the gateway's own routes from its OpenAPI document and the CurseForge and Modrinth passthroughs with the budget's refusals handled."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]
keywords = ["curseforge", "modrinth", "minecraft", "api-client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/matejhozlar/createrington-content-gateway"
Changelog = "https://github.com/matejhozlar/createrington-content-gateway/blob/main/packages/python-client/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_gateway"]

[tool.hatch.build.targets.sdist]
include = ["src/content_gateway", "README.md", "CHANGELOG.md"]

[dependency-groups]
dev = [
  "anyio>=4.12",
  "datamodel-code-generator>=0.89",
  "mypy>=2.4",
  "pytest>=9.2",
  "ruff>=0.17",
]

[tool.uv]
required-version = ">=0.13.7"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PT"]
ignore = ["ANN401", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/content_gateway/generated.py" = ["I001"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
