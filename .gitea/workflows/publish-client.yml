name: Publish client

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-client
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  publish:
    runs-on: oracle
    env:
      NPM_PUBLISH_REGISTRY: ${{ vars.NPM_PUBLISH_REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate the publish variables
        run: |
          : "${NPM_PUBLISH_REGISTRY:?}"

      - name: Setup
        uses: ./.ci/actions/setup

      - name: Refuse to publish with changesets left unconsumed
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "::error::These changesets were not turned into a version, run pnpm version-packages in the release PR:"
            echo "$pending"
            exit 1
          fi

      - name: Build
        run: pnpm --filter @createrington/content-gateway-client build

      - name: Publish the version the registry does not have yet
        env:
          npm_config_registry: ${{ env.NPM_PUBLISH_REGISTRY }}
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          : "${NPM_PUBLISH_TOKEN:?}"
          host=$(node -p "const url = new URL(process.env.npm_config_registry); url.host + url.pathname")
          echo "//${host}:_authToken=${NPM_PUBLISH_TOKEN}" >> .npmrc
          pnpm changeset publish --no-git-tag
