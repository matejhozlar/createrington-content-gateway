name: Publish client

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-client
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: oracle
    timeout-minutes: 15
    env:
      NPM_PUBLISH_REGISTRY: ${{ vars.NPM_PUBLISH_REGISTRY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the publish variables
        run: |
          : "${NPM_PUBLISH_REGISTRY:?}"

      - name: Setup
        uses: ./.ci/actions/setup

      - name: Refuse to publish with changesets left unconsumed
        run: node scripts/check-pending-changesets.mjs

      - name: Client checks
        uses: ./.ci/actions/client

      - name: Publish the version the registry does not have yet
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          : "${NPM_PUBLISH_TOKEN:?}"
          scope=$(node -p "require('./packages/client/package.json').name.split('/')[0]")
          host=$(node -p "const url = new URL(process.env.NPM_PUBLISH_REGISTRY); url.host + url.pathname")
          {
            echo "${scope}:registry=${NPM_PUBLISH_REGISTRY}"
            echo "//${host}:_authToken=${NPM_PUBLISH_TOKEN}"
          } >> .npmrc
          pnpm changeset publish --no-git-tag
