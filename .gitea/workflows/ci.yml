name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  format:
    runs-on: oracle
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.ci/actions/setup

      - name: Repository checks
        uses: ./.ci/actions/repo-checks

  audit:
    runs-on: oracle
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.ci/actions/setup

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  client:
    runs-on: oracle
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.ci/actions/setup

      - name: Refuse a release that leaves changesets unconsumed
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: node scripts/check-pending-changesets.mjs

      - name: Client checks
        uses: ./.ci/actions/client
        with:
          node-version: ${{ matrix.node }}

  python:
    runs-on: oracle
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: ./.ci/actions/setup-uv

      - name: Python client checks
        uses: ./.ci/actions/python-client
        with:
          python-version: ${{ matrix.python }}

  rust-format:
    runs-on: hetzner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.ci/actions/setup-rust
        with:
          cache-target: "false"

      - name: Check formatting
        run: cargo fmt --all --check

  rust-deps:
    runs-on: hetzner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.ci/actions/setup-rust
        with:
          cache-target: "false"

      - name: Rust dependency checks
        uses: ./.ci/actions/rust-deps

  rust:
    runs-on: hetzner
    timeout-minutes: 45
    services:
      content-gateway-test-redis:
        image: redis:8.10-alpine
    env:
      CONTENT_GATEWAY_TEST_REDIS_URL: redis://content-gateway-test-redis:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.ci/actions/setup-rust

      - name: Rust checks
        uses: ./.ci/actions/rust-checks

      - name: Show the compile cache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  docker:
    runs-on: hetzner
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the static binary
        uses: ./.ci/actions/docker-binary
