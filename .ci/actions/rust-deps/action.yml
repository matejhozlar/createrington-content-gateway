name: Rust dependency checks
description: Install cargo-deny and cargo-machete at the pinned versions, then check advisories, licences, bans, sources and unused dependencies. Runs after the setup-rust action.

inputs:
  cargo-deny-version:
    description: The cargo-deny version to install
    # renovate: datasource=crate depName=cargo-deny
    default: "0.20.2"
  cargo-machete-version:
    description: The cargo-machete version to install
    # renovate: datasource=crate depName=cargo-machete
    default: "0.9.2"

runs:
  using: composite
  steps:
    - name: Cache dependency tools
      if: env.CI_PERSISTENT_RUST != '1'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/cargo-deny
          ~/.cargo/bin/cargo-machete
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-deps-tools-${{ inputs.cargo-deny-version }}-${{ inputs.cargo-machete-version }}

    - name: Install dependency tools
      shell: bash
      env:
        CARGO_DENY_VERSION: ${{ inputs.cargo-deny-version }}
        CARGO_MACHETE_VERSION: ${{ inputs.cargo-machete-version }}
      run: |
        cargo-deny --version 2> /dev/null | grep -qF "$CARGO_DENY_VERSION" \
          || cargo install --locked "cargo-deny@$CARGO_DENY_VERSION"
        cargo-machete --version 2> /dev/null | grep -qF "$CARGO_MACHETE_VERSION" \
          || cargo install --locked "cargo-machete@$CARGO_MACHETE_VERSION"

    - name: Check advisories, licences, bans and sources
      shell: bash
      run: cargo deny --locked check

    - name: Find unused dependencies
      shell: bash
      run: cargo machete
