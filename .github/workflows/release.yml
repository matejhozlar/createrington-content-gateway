name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build, such as v0.1.1
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  check:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      built_at: ${{ steps.release.outputs.built_at }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check that the tag and the manifests agree
        id: release
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          package=$(node -p "require('./package.json').version")
          cargo=$(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$package" ] || [ "$version" != "$cargo" ]; then
            echo "::error::Tag $tag does not match package.json ($package) and Cargo.toml ($cargo)"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$(git rev-parse HEAD^{commit})"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Write the release notes from the changelog
        run: |
          mkdir -p notes
          awk -v tag="${{ steps.release.outputs.tag }}" '
            /^## / { printing = ($2 == tag); next }
            printing
          ' CHANGELOG.md | sed -e '/./,$!d' > notes/notes.md
          if [ ! -s notes/notes.md ]; then
            echo "Release ${{ steps.release.outputs.tag }}" > notes/notes.md
          fi
          cat notes/notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes/notes.md

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the static binary
        uses: docker/build-push-action@v7
        with:
          context: .
          target: binary
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=build
          build-args: |
            CONTENT_GATEWAY_COMMIT=${{ needs.check.outputs.commit }}
            CONTENT_GATEWAY_BUILT_AT=${{ needs.check.outputs.built_at }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Name the binary after its target
        run: |
          test -x build/content-gateway
          mkdir -p dist
          mv build/content-gateway "dist/content-gateway-${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Describe the image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.check.outputs.image }}

      - name: Build and push the image by digest
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CONTENT_GATEWAY_COMMIT=${{ needs.check.outputs.commit }}
            CONTENT_GATEWAY_BUILT_AT=${{ needs.check.outputs.built_at }}
          outputs: type=image,name=${{ needs.check.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}

      - name: Keep the digest for the manifest
        run: |
          mkdir -p digests
          digest="${{ steps.image.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.target }}
          path: digests/*
          if-no-files-found: error

  image:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.check.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check.outputs.tag }}

      - name: Publish the multi-arch manifest
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ needs.check.outputs.image }}@sha256:%s ' *)
          docker buildx imagetools inspect "${{ needs.check.outputs.image }}:${{ needs.check.outputs.version }}"

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit }}

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: notes

      - name: Add the OpenAPI document and the checksums
        working-directory: dist
        run: |
          cp ../openapi.json openapi.json
          sha256sum content-gateway-* openapi.json > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          body_path: notes/notes.md
          files: dist/*
          fail_on_unmatched_files: true
