name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build, such as v0.1.1
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      built_at: ${{ steps.release.outputs.built_at }}
      image: ${{ steps.release.outputs.image }}
      newest: ${{ steps.release.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true

      - name: Check that the tag and the manifests agree
        id: release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a release tag such as v0.1.1"
            exit 1
          fi
          version="${TAG#v}"
          package=$(node -p "require('./package.json').version")
          cargo=$(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$package" ] || [ "$version" != "$cargo" ]; then
            echo "::error::Tag $TAG does not match package.json ($package) and Cargo.toml ($cargo)"
            exit 1
          fi
          newest=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "commit=$(git rev-parse 'HEAD^{commit}')"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "newest=$([ "$newest" = "$TAG" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Write the release notes from the changelog
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p notes
          awk -v tag="$TAG" '
            /^## / { printing = ($2 == tag); next }
            printing
          ' CHANGELOG.md | sed -e '/./,$!d' > notes/notes.md
          if [ ! -s notes/notes.md ]; then
            echo "Release $TAG" > notes/notes.md
          fi
          cat notes/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/notes.md

  build:
    if: github.server_url == 'https://github.com'
    needs: check
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the static binary
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: binary
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=build
          build-args: |
            CONTENT_GATEWAY_COMMIT=${{ needs.check.outputs.commit }}
            CONTENT_GATEWAY_BUILT_AT=${{ needs.check.outputs.built_at }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Name the binary after its target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test -x build/content-gateway
          mkdir -p dist
          mv build/content-gateway "dist/content-gateway-$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Describe the image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.check.outputs.image }}

      - name: Build and push the image by digest
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CONTENT_GATEWAY_COMMIT=${{ needs.check.outputs.commit }}
            CONTENT_GATEWAY_BUILT_AT=${{ needs.check.outputs.built_at }}
          outputs: type=image,name=${{ needs.check.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}

      - name: Keep the digest for the manifest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.target }}
          path: digests/*
          if-no-files-found: error

  image:
    if: github.server_url == 'https://github.com'
    needs: [check, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.check.outputs.image }}
          flavor: |
            latest=${{ needs.check.outputs.newest }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check.outputs.tag }},enable=${{ needs.check.outputs.newest }}

      - name: Publish the multi-arch manifest
        working-directory: digests
        env:
          IMAGE: ${{ needs.check.outputs.image }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    if: github.server_url == 'https://github.com'
    needs: [check, build, image]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes

      - name: Add the OpenAPI document and the checksums
        working-directory: dist
        run: |
          cp ../openapi.json openapi.json
          sha256sum content-gateway-* openapi.json > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          body_path: notes/notes.md
          files: dist/*
          fail_on_unmatched_files: true
